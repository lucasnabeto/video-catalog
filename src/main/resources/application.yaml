spring:
  application:
    name: videocatalog
  datasource:
    url: jdbc:postgresql://${DB_HOST}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
#    show-sql: true
#    format-sql: true
hibernate:
  dialect: org.hibernate.dialect.HSQLDialect
server:
  port: 8080