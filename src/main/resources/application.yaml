spring:
  application:
    name: videocatalog
  datasource:
    url: jdbc:postgresql://${DB_HOST}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
#    show-sql: true #Enable to show generated SQL in the console
#    format-sql: true #Enable to format SQL in the console
hibernate:
  dialect: org.hibernate.dialect.HSQLDialect
server:
  port: 8080
#  error:
#    include-stacktrace: never #Blocks stacktrace in error responses.